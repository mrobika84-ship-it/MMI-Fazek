<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-labelledby="title desc">
<title id="title">MMI Fazék</title>
<desc id="desc">Piros-fehér MMI Fazék logó MMI specialista felirattal</desc>
<defs>
  <linearGradient id="red" x1="0" x2="1">
    <stop offset="0" stop-color="#ff2438"/>
    <stop offset="1" stop-color="#b80f1f"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<g transform="translate(20 23)">
  <path d="M12 14h202l-20 88H0z" fill="none" stroke="#eef2f7" stroke-width="5"/>
  <g fill="url(#red)" filter="url(#glow)">
