    <path d="M79 30h52l-17 22H68z"/>
    <path d="M64 58h66l-16 18H55z"/>
    <path d="M51 82h69l-16 16H43z"/>
  </g>
</g>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="275" y="74" fill="#f2f4f7" font-size="56" font-weight="900" letter-spacing="2">MMI FAZÉK</text>
  <line x1="277" y1="91" x2="708" y2="91" stroke="#d61a2b" stroke-width="3"/>
  <text x="279" y="121" fill="#aeb7c4" font-size="20" font-weight="800" letter-spacing="4">MMI SPECIALISTA</text>
</g>
</svg>