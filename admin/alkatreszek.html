<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MMI Fazék – Alkatrészkezelő</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#090e15;color:#f4f6fa;font-family:system-ui}main{max-width:1050px;margin:auto}a{color:#ffb8c0}button,input,select,textarea{font:inherit;padding:11px;border-radius:9px}input,select,textarea{background:#141e2b;color:#fff;border:1px solid #536074;max-width:100%}button{background:#dc2335;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.toolbar,.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:15px 0}.card{background:#131d29;border:1px solid #344052;border-radius:13px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.grid img{width:100%;height:140px;object-fit:cover;border-radius:9px}.field{display:grid;gap:6px;margin:12px 0}.hidden{display:none}.muted{color:#b5bfcd}.error{color:#ff9da6}textarea{width:100%;min-height:95px}#form input:not([type=file]){width:100%}.secondary{background:#344052}</style></head><body><main><p><a href="/admin/">← Admin</a></p><h1>Használt alkatrészek kezelése</h1><p class="muted">Mindkét jogosult felhasználó kezelheti a hirdetéseket és az almappákat. A régi hirdetések változatlanul megmaradnak.</p><section id="locked">Jogosultság ellenőrzése…</section><section id="manager" class="hidden"><div class="toolbar"><select id="root"><option value="2g">MMI 2G</option><option value="3g">MMI 3G</option></select><button id="up" class="secondary">↑ Vissza</button><button id="newfolder" class="secondary">+ Új mappa</button><button id="newitem">+ Új hirdetés</button><button id="importOld" class="secondary" type="button">Régi hirdetések átvétele</button></div><p id="path"></p><p id="status" role="status"></p><div id="listing" class="grid"></div><form id="form" class="card hidden"><h2 id="formtitle">Hirdetés</h2><div class="field"><label for="name">Alkatrész neve *</label><input id="name" required maxlength="140"></div><div class="field"><label for="price">Ár (Ft)</label><input id="price" type="number" min="0" step="1" placeholder="pl. 20000"></div><div class="field"><label for="description">Leírás</label><textarea id="description" maxlength="4000"></textarea></div><div class="field"><label for="photos">Új fényképek (több is választható)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></div><div id="photoPreview" class="grid"></div><div class="actions"><button id="save" type="submit">Hirdetés mentése</button><button id="cancel" type="button" class="secondary">Mégse</button></div></form></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://mpnyvjulonpommrxqxeg.supabase.co','sb_publishable_IrsJ0ZIDmHaMY8NsJxSH0w_Rz33kZpg'),storage=sb.storage.from('gallery'),$=id=>document.getElementById(id);
let folder='parts/2g',editing=null,removedPhotos=[];
const msg=(t,e=false)=>{$('status').textContent=t;$('status').className=e?'error':''};
const url=p=>storage.getPublicUrl(p).data.publicUrl;
const valid=s=>s.length>0&&s.length<=80&&!/[\\/\x00-\x1f]/.test(s)&&s!=='.'&&s!=='..'&&!s.startsWith('.');
async function auth(){const {data:{user},error}=await sb.auth.getUser();if(error||!user){$('locked').textContent='Jelentkezz be az adminoldalon.';return}const {data:role,error:e}=await sb.from('admin_roles').select('role').eq('user_id',user.id).maybeSingle();if(e||!role||!['super_admin','editor'].includes(role.role)){$('locked').textContent='Nincs jogosultságod.';return}$('locked').classList.add('hidden');$('manager').classList.remove('hidden');await load()}
function hideForm(){$('form').classList.add('hidden');editing=null;removedPhotos=[];$('photos').value=''}
async function readJSON(path){const {data,error}=await storage.download(path);if(error)throw error;return JSON.parse(await data.text())}
async function load(){hideForm();$('path').textContent=folder.replace('parts/','').replaceAll('/',' / ');$('up').disabled=folder.split('/').length<=2;msg('Betöltés…');const {data,error}=await storage.list(folder,{limit:1000,sortBy:{column:'name',order:'asc'}});if(error){msg(error.message,true);return}const listing=$('listing');listing.replaceChildren();let count=0;
for(const f of data||[]){if(!f.name||f.name==='.keep')continue;
if(!f.id){const card=document.createElement('div');card.className='card';const btn=document.createElement('button');btn.className='secondary';btn.textContent='📁 '+f.name;btn.onclick=()=>{folder+='/'+f.name;load()};card.append(btn);listing.append(card);continue}
if(!f.name.endsWith('.json')||!f.name.startsWith('item-'))continue;
try{const item=await readJSON(folder+'/'+f.name);count++;const card=document.createElement('article');card.className='card';const title=document.createElement('h3');title.textContent=item.name||'Alkatrész';const desc=document.createElement('p');desc.textContent=(item.price!==''&&item.price!=null?Number(item.price).toLocaleString('hu-HU')+' Ft · ':'')+(item.description||'');card.append(title,desc);if(item.photos?.length){const img=document.createElement('img');img.src=url(item.photos[0]);img.alt=item.name;card.prepend(img)}const edit=document.createElement('button');edit.textContent='Szerkesztés';edit.onclick=()=>openForm(item,folder+'/'+f.name);const del=document.createElement('button');del.textContent='Törlés';del.className='secondary';del.style.marginLeft='8px';del.onclick=async()=>{if(!confirm('Biztosan törlöd ezt a hirdetést? '+item.name))return;const {error}=await storage.remove([folder+'/'+f.name,...(item.photos||[])]);if(error)msg(error.message,true);else load()};card.append(edit,del);listing.append(card)}catch(e){console.warn(e)}
}msg(count+' hirdetés betöltve.')}
function renderPhotos(item){const box=$('photoPreview');box.replaceChildren();for(const path of item.photos||[]){if(removedPhotos.includes(path))continue;const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.src=url(path);img.alt='Alkatrész fénykép';const del=document.createElement('button');del.type='button';del.className='secondary';del.textContent='Kép eltávolítása';del.onclick=()=>{removedPhotos.push(path);renderPhotos(item)};card.append(img,del);box.append(card)}}
function openForm(item=null,path=null){editing=path;removedPhotos=[];$('form').classList.remove('hidden');$('formtitle').textContent=item?'Hirdetés szerkesztése':'Új hirdetés';$('name').value=item?.name||'';$('price').value=item?.price??'';$('description').value=item?.description||'';$('photos').value='';renderPhotos(item||{photos:[]});$('form').scrollIntoView({behavior:'smooth'})}
$('root').onchange=()=>{folder='parts/'+$('root').value;load()};$('up').onclick=()=>{if(folder.split('/').length>2){folder=folder.slice(0,folder.lastIndexOf('/'));load()}};$('newitem').onclick=()=>openForm();$('cancel').onclick=hideForm;
$('newfolder').onclick=async()=>{const name=(prompt('Új almappa neve:')||'').trim();if(!name)return;if(!valid(name)){msg('Érvénytelen mappanév.',true);return}const {error}=await storage.upload(folder+'/'+name+'/.keep',new Blob([''],{type:'text/plain'}),{contentType:'text/plain',upsert:false});if(error){msg(error.message,true);return}folder+='/'+name;load()};
$('form').onsubmit=async e=>{e.preventDefault();const btn=$('save');btn.disabled=true;try{
const name=$('name').value.trim();if(!name)throw Error('Add meg az alkatrész nevét.');
const original=editing?await readJSON(editing):null;
const id=original?.id||crypto.randomUUID(),photos=(original?.photos||[]).filter(p=>!removedPhotos.includes(p));
for(const file of $('photos').files){if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>20*1024*1024)throw Error('Nem támogatott kép vagy 20 MB feletti fájl: '+file.name);const ext=file.name.split('.').pop().toLowerCase(),path=folder+'/photos/'+id+'/'+crypto.randomUUID()+'.'+ext;msg('Kép feltöltése: '+file.name);const {error}=await storage.upload(path,file,{contentType:file.type});if(error)throw error;photos.push(path)}
const item={id,name,price:$('price').value===''?'':Number($('price').value),description:$('description').value.trim(),photos,updatedAt:new Date().toISOString()};
const target=editing||folder+'/item-'+id+'.json';
const {error}=await storage.upload(target,new Blob([JSON.stringify(item)],{type:'application/json'}),{contentType:'application/json',upsert:!!editing});if(error)throw error;
if(removedPhotos.length){const {error:removeError}=await storage.remove(removedPhotos);if(removeError)console.warn('Old photo removal failed',removeError)}
await load();msg('Hirdetés sikeresen mentve.');
}catch(err){msg('Mentési hiba: '+(err.message||err),true)}finally{btn.disabled=false}};

const oldListings=[["2g","MMI 2G erősítő",20000,"Audi / ASK Sound Amplifier.",["viber_kép_2026-09-17_13-07-39-564.jpg"]],["2g","MMI 2G Bose erősítő",40000,"Bose hangrendszerhez való erősítőegység.",["viber_kép_2026-09-17_13-07-40-041.jpg"]],["2g","MMI 2G erősítő",20000,"Audi gyári erősítőegység.",["viber_kép_2026-09-17_13-07-40-246.jpg"]],["2g","MMI 2G DAB tuner","","Audi / Kenwood DAB tuner egység.",["viber_kép_2026-09-17_13-07-40-462.jpg"]],["2g","Digitális klímapanel – szürke","","Ülésfűtéses kivitel.",["viber_kép_2026-09-17_13-07-41-541.jpg"]],["2g","Digitális klímapanel – fekete","","Ülésfűtéses kivitel.",["viber_kép_2026-09-17_13-07-41-962.jpg"]],["3g","MMI 3G kezelő",35000,"",["viber_kép_2026-09-17_13-07-32-366.jpg"]],["3g","MMI 3G Radio Unit","","",["viber_kép_2026-09-17_13-07-40-693.jpg","viber_kép_2026-09-17_13-07-40-901.jpg"]],["3g","MMI 3G Main Unit","","",["viber_kép_2026-09-17_13-07-41-120.jpg","viber_kép_2026-09-17_13-07-41-334.jpg"]]];
$('importOld').onclick=async()=>{
 if(!confirm('A 9 régi hirdetést és a 11 fényképet átmásoljuk a Supabase-ba. A régi oldalak és képek megmaradnak. Indítod?'))return;
 const btn=$('importOld');btn.disabled=true;let imported=0,skipped=0,failed=[];
 try{
  for(let i=0;i<oldListings.length;i++){
   const [category,name,price,description,images]=oldListings[i];
   const id='legacy-'+category+'-'+String(i+1).padStart(2,'0'),dir='parts/'+category,target=dir+'/item-'+id+'.json';
   msg('Átvétel '+(i+1)+'/'+oldListings.length+': '+name);
   try{
    const {data:present,error:check}=await storage.info(target);
    if(!check&&present){skipped++;continue}
    const photos=[];
    for(let j=0;j<images.length;j++){
     const filename=images[j],ext=filename.split('.').pop().toLowerCase(),photoPath=dir+'/photos/'+id+'/legacy-photo-'+String(j+1).padStart(2,'0')+'.'+ext;
     const {data:existing,error:photoCheck}=await storage.info(photoPath);
     if(!photoCheck&&existing){photos.push(photoPath);continue}
     const res=await fetch('/'+encodeURIComponent(filename));
     if(!res.ok)throw Error('Nem érhető el a kép: '+filename+' (HTTP '+res.status+')');
     const blob=await res.blob();
     const {error:uploadError}=await storage.upload(photoPath,blob,{contentType:'image/jpeg',upsert:false});
     if(uploadError&&!/already exists|duplicate/i.test(uploadError.message))throw uploadError;
     photos.push(photoPath);
    }
    const item={id,name,price,description,photos,updatedAt:new Date().toISOString()};
    const {error:saveError}=await storage.upload(target,new Blob([JSON.stringify(item)],{type:'application/json'}),{contentType:'application/json',upsert:false});
    if(saveError){if(/already exists|duplicate/i.test(saveError.message)){skipped++;continue}throw saveError}
    imported++;
   }catch(e){failed.push(name+': '+(e.message||e))}
  }
  folder='parts/'+$('root').value;
  await load();
  msg('Átvétel kész: '+imported+' új hirdetés, '+skipped+' már megvolt, '+failed.length+' hiba.'+(failed.length?' Hibák: '+failed.join('; '):''),failed.length>0);
 }finally{btn.disabled=false}
};
auth();
</script></body></html>
